<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>選挙 一問一答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho:wght@600;800&display=swap">
<style>
/* Layout: one narrow column like a ballot sheet. Header with this round's tally, a three-step rail for the 3 rounds, the question card with a ruled answer box, then a board of all 22 questions. */
:root{
  --bg:#EEF0ED;
  --surface:#FFFFFF;
  --box:#F5F6F3;
  --ink:#172033;
  --ink-soft:#566075;
  --line:#D2D7D1;
  --accent:#1D4E9E;
  --accent-ink:#FFFFFF;
  --ok:#17703F;
  --ok-bg:#E0F1E7;
  --ng:#B2342F;
  --ng-bg:#F8E3E0;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151D;--surface:#1A2030;--box:#141A27;--ink:#E7EBF2;--ink-soft:#A0AABD;--line:#2C3548;
    --accent:#8DB2F4;--accent-ink:#0D1320;--ok:#74D3A0;--ok-bg:#153122;--ng:#F59C97;--ng-bg:#3B1E1F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151D;--surface:#1A2030;--box:#141A27;--ink:#E7EBF2;--ink-soft:#A0AABD;--line:#2C3548;
  --accent:#8DB2F4;--accent-ink:#0D1320;--ok:#74D3A0;--ok-bg:#153122;--ng:#F59C97;--ng-bg:#3B1E1F;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto;display:grid;gap:16px}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{margin:0;font-size:13px;letter-spacing:.14em;color:var(--ink-soft)}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.25;letter-spacing:.04em;text-wrap:balance}

.tally{display:flex;gap:8px;margin:0;padding:0;list-style:none;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:baseline;padding:2px 12px;border-radius:999px;font-weight:700;font-size:15px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.ng{background:var(--ng-bg);color:var(--ng)}
.pill.none{background:var(--box);color:var(--ink-soft)}

.rail{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{display:grid;padding:6px 10px;border:2px dashed var(--line);border-radius:8px;color:var(--ink-soft);font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;min-width:0}
.step b{font-size:15px;color:inherit}
.step.done{border-style:solid;background:var(--box)}
.step.now{border:2px solid var(--accent);background:var(--surface);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 18px 12px;display:grid;gap:16px;scroll-margin-top:12px}
.card-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.qno small{font-size:18px;margin-right:4px;font-weight:600}
.round{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--box);color:var(--ink-soft)}
.pos{margin-left:auto;color:var(--ink-soft);font-size:14px;font-variant-numeric:tabular-nums}
.prev{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px}
.prev.ok{background:var(--ok-bg);color:var(--ok)}
.prev.ng{background:var(--ng-bg);color:var(--ng)}

.qtext{margin:0;font-size:18px;line-height:1.8}
.blank{display:inline-block;min-width:3em;text-align:center;border-bottom:2px solid var(--ink);margin:0 2px;color:var(--ink-soft);font-size:.9em;line-height:1.3}
.items{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.items li{padding:2px 12px;border:1px solid var(--line);border-radius:6px;background:var(--box);font-weight:700}
.choices{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.choices li{display:flex;gap:10px;padding:8px 12px;background:var(--box);border-radius:6px;min-width:0}
.choices b{font-family:var(--f-display);font-weight:800;min-width:1.4em}
@media (min-width:520px){.choices.cols{grid-template-columns:1fr 1fr}}

.answer{border:1.5px dashed var(--line);border-radius:6px;min-height:84px;padding:10px 14px 12px;display:grid;gap:4px;align-content:start}
.answer.on{border-style:solid;border-color:var(--accent);background:var(--box)}
.a-label{font-size:12px;letter-spacing:.2em;color:var(--ink-soft)}
.a-main{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.3;overflow-wrap:anywhere}
.a-sub{list-style:none;margin:0;padding:0;font-size:15px;color:var(--ink-soft)}
.parts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.parts li{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline;padding-top:8px;border-top:1px solid var(--line)}
.parts li:first-child{border-top:0;padding-top:0}
.parts .p-l{font-weight:700}
.parts .a-main{font-size:26px}
.parts .p-t{grid-column:1/-1;font-size:14px;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){
  .answer.on{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}

.actions{display:grid;gap:10px}
.btn-main{min-height:56px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;cursor:pointer;padding:0 16px}
.btn-sub{min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;padding:0 16px}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mark{min-height:64px;border-radius:8px;border:2px solid;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.mark i{font-style:normal;font-family:var(--f-display);font-size:30px;line-height:1}
.mark.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.mark.ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.nav{display:flex;justify-content:space-between}
.link{min-height:44px;padding:0 4px;background:none;border:0;color:var(--ink-soft);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:disabled{opacity:.4;cursor:default;text-decoration:none}

.score{display:flex;align-items:baseline;gap:8px;margin:0}
.s-big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.s-of{color:var(--ink-soft)}
.note{margin:0;color:var(--ink-soft)}
.misslist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.misslist li{border-top:1px solid var(--line);padding-top:10px;min-width:0}
.m-head{display:flex;gap:10px;align-items:baseline;min-width:0}
.m-head b{white-space:nowrap}
.m-q{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);font-size:14px}
.m-a{font-family:var(--f-display);font-weight:800;font-size:20px;overflow-wrap:anywhere}

.board h2{margin:0 0 10px;font-size:14px;letter-spacing:.14em;color:var(--ink-soft);font-weight:700}
.cells{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.cell{width:100%;min-height:52px;display:grid;place-items:center;align-content:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;padding:4px 0}
.cell .n{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums}
.cell .m{font-size:13px;line-height:1.2;height:1.2em;font-weight:700}
.cell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cell.ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.cell.past{background:var(--box);color:var(--ok);opacity:.55;cursor:default}
.cell.now{outline:3px solid var(--accent);outline-offset:1px}

.laps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.laps li{display:grid;grid-template-columns:4.5em 1fr 5.5em;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.bar{height:14px;border-radius:7px;background:var(--box);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.laps .v{text-align:right;font-weight:700}
.cell:disabled{cursor:default}
.foot{display:flex;justify-content:flex-end}
</style>
</head>
<body>

<main class="wrap">
  <header class="head">
    <div>
      <p class="eyebrow">講義Ⅱ　No.1</p>
      <h1>選挙 一問一答</h1>
    </div>
    <ul class="tally" id="tally" aria-label="この周の結果（1回目の答え）"></ul>
  </header>

  <ol class="rail" id="rail" aria-label="3周のすすみぐあい"></ol>

  <section class="card" id="card" aria-live="polite"></section>

  <section class="board" aria-labelledby="bh">
    <h2 id="bh">問題一覧</h2>
    <ol class="cells" id="cells"></ol>
  </section>

  <div class="foot"><button class="link" id="reset" type="button" data-act="reset">最初からやり直す</button></div>
</main>

<script>
(function(){
'use strict';

const Q=[
 {n:1,q:"日本における直接民主制の例として最もふさわしくないものを次から選び、記号で答えなさい。",
  choices:[["ア","日本国憲法改正の国民投票"],["イ","内閣総理大臣の指名"],["ウ","最高裁判所裁判官の国民審査"]],a:"イ",pick:["イ"]},
 {n:2,q:"人々が自分たちのなかから選んだ代表者を通じて意思を決定する政治の仕組みを何といいますか。解答らんに合わせて答えなさい。",a:"間接（民主制）"},
 {n:3,q:"次の①〜④について述べた文として正しいものをあとのア〜エから1つずつ選び、記号で答えなさい。",
  items:["① 秘密選挙","② 普通選挙","③ 平等選挙","④ 直接選挙"],
  choices:[["ア","自分が選んだ候補者に直接投票する。"],["イ","自分が誰に投票したかを他人に知られないようにする。"],["ウ","一定の年齢以上のすべての国民が選挙権を有する。"],["エ","一人一票の選挙権を有する。"]],
  parts:[["① 秘密選挙","イ"],["② 普通選挙","ウ"],["③ 平等選挙","エ"],["④ 直接選挙","ア"]]},
 {n:4,q:"政権を担当する政党を何といいますか。",a:"与党"},
 {n:5,q:"政権を担当しない政党を何といいますか。",a:"野党"},
 {n:6,q:"1つの選挙区から一人を選ぶ選挙制度を何といいますか。",a:"小選挙区制"},
 {n:7,q:"1つの選挙区から二人以上を選ぶ選挙制度を何といいますか。",a:"大選挙区制"},
 {n:8,q:"各政党の得票数を整数で割り、数値の大きい順に当選者を決める、比例代表制の配分方法を何といいますか。",a:"ドント方式（ドント式）"},
 {n:9,q:"日本の選挙の所管官庁を何といいますか。",a:"総務省"},
 {n:10,q:"日本の選挙の方法や選挙運動・選挙費用の制限などについて定められている法律を何といいますか。",a:"公職選挙法"},
 {n:11,q:"日本の選挙権年齢は何歳以上ですか。",a:"（満）18歳以上"},
 {n:12,q:"衆議院議員の被選挙権は何歳以上ですか。",a:"（満）25歳以上"},
 {n:13,q:"衆議院議員の議員定数は何名ですか。",a:"465名"},
 {n:14,q:"参議院議員の被選挙権は何歳以上ですか。",a:"（満）30歳以上"},
 {n:15,q:"参議院議員の議員定数は何名ですか。",a:"248名"},
 {n:16,q:"2022年末現在、衆議院議員総選挙における小選挙区は何区ありますか。",a:"289区"},
 {n:17,q:"衆議院議員総選挙において、選挙区の落選者が（※）代表で復活当選することがあります。（※）にあてはまる語句を漢字2字で答えなさい。",a:"比例"},
 {n:18,q:"参議院議員通常選挙は何年ごとに行われますか。",a:"3年ごと"},
 {n:19,q:"1回の参議院議員通常選挙では何名を選出しますか。",a:"124名"},
 {n:20,q:"参議院議員通常選挙の選挙区において、合区となっている都道府県の組み合わせ（2022年末現在）として正しいものを次から2つ選び、記号で答えなさい。",
  choices:[["ア","宮崎県・大分県"],["イ","高知県・徳島県"],["ウ","香川県・愛媛県"],["エ","鳥取県・島根県"],["オ","和歌山県・奈良県"],["カ","秋田県・山形県"]],
  cols:true,a:"イ・エ",pick:["イ","エ"]},
 {n:21,q:"「一票の格差」問題について、各選挙区の議員1人あたりの有権者数に差があることが、（※）に反するとの見方が存在します。（※）にあてはまる語句を解答らんに合わせて漢字2字で答えなさい。",a:"平等（権）"},
 {n:22,q:"選挙当日に仕事や用事があることが見込まれる人が事前に投票できる制度を何といいますか。",a:"期日前投票"}
];
const byN={};
Q.forEach(q=>{byN[q.n]=q;});

const ROUNDS=3;
const KEY='senkyo-ichimon-ittou:v3';
const $=id=>document.getElementById(id);
const ALL=Q.map(q=>q.n);

/* 1周 = 全問。×の問題は、同じ周のうちにもう一度出る。1回目の答えだけが成績になる。 */
function fresh(){
  return {round:1,queue:ALL.slice(),first:{},cleared:{},hist:[],finished:false,undo:null};
}
function cleanMap(o,allowed){
  const x={};
  if(o&&typeof o==='object'){
    for(const k in o){ if(byN[k]&&allowed.indexOf(o[k])>=0) x[k]=o[k]; }
  }
  return x;
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!s||!Number.isInteger(s.round)||s.round<1||s.round>ROUNDS) return fresh();
    if(!Array.isArray(s.queue)||!s.queue.every(n=>Number.isInteger(n)&&byN[n])) return fresh();
    if(!Array.isArray(s.hist)) return fresh();
    const hist=s.hist.filter(h=>h&&Number.isInteger(h.ok)&&Number.isInteger(h.total));
    const fin=s.finished===true;
    if(fin&&s.round!==ROUNDS) return fresh();
    if(fin?hist.length!==ROUNDS:hist.length!==s.round-1) return fresh();
    return {round:s.round,queue:s.queue,first:cleanMap(s.first,['ok','ng']),cleared:cleanMap(s.cleared,[true]),hist:hist,finished:fin,undo:null};
  }catch(e){return fresh();}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

let st=load();
let revealed=false;
let resetArmed=false;
let resetTimer=0;

const blankify=t=>t.replace(/（\s*※\s*）/g,'（<span class="blank">※</span>）');
const plain=t=>t.replace(/（\s*※\s*）/g,'（　）');
function shortA(q){
  return q.parts?q.parts.map(p=>p[0].charAt(0)+p[1]).join('　'):q.a;
}
const firstOkCount=()=>ALL.filter(n=>st.first[n]==='ok').length;
const clearedCount=()=>Object.keys(st.cleared).length;

/* ---------- header, rail ---------- */
function renderHead(){
  const ok=firstOkCount();
  const ng=ALL.filter(n=>st.first[n]==='ng').length;
  $('tally').innerHTML=
    '<li class="pill ok" aria-label="1回目で○ '+ok+'問">○ '+ok+'</li>'+
    '<li class="pill ng" aria-label="1回目で× '+ng+'問">× '+ng+'</li>';
}
function renderRail(){
  let h='';
  for(let i=1;i<=ROUNDS;i++){
    let cls='todo',sub='全'+ALL.length+'問';
    if(i<=st.hist.length){
      cls='done';sub='○ '+st.hist[i-1].ok+' / '+st.hist[i-1].total;
    }else if(i===st.round&&!st.finished){
      cls='now';sub=clearedCount()+' / '+ALL.length+'問';
    }
    h+='<li class="step '+cls+'"'+(cls==='now'?' aria-current="step"':'')+'><b>'+i+'周目</b><span>'+sub+'</span></li>';
  }
  $('rail').innerHTML=h;
}

/* ---------- card ---------- */
function answerHTML(q){
  const lk={};
  (q.choices||[]).forEach(c=>{lk[c[0]]=c[1];});
  if(q.parts){
    return '<ul class="parts">'+q.parts.map(p=>
      '<li><span class="p-l">'+p[0]+'</span><span class="a-main">'+p[1]+'</span><span class="p-t">'+lk[p[1]]+'</span></li>'
    ).join('')+'</ul>';
  }
  let h='<p class="a-main">'+q.a+'</p>';
  if(q.pick){
    h+='<ul class="a-sub">'+q.pick.map(k=>'<li>'+k+'　'+lk[k]+'</li>').join('')+'</ul>';
  }
  return h;
}
function missHTML(){
  const ngs=ALL.filter(n=>st.first[n]==='ng');
  if(!ngs.length) return '';
  return '<ul class="misslist">'+ngs.map(n=>{
    const q=byN[n];
    return '<li><div class="m-head"><b>問'+n+'</b><span class="m-q">'+plain(q.q)+'</span></div><div class="m-a">'+shortA(q)+'</div></li>';
  }).join('')+'</ul>';
}
function questionHTML(){
  const q=byN[st.queue[0]];
  const again=st.first[q.n]==='ng';
  const items=q.items?'<ul class="items">'+q.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>':'';
  const choices=q.choices?'<ul class="choices'+(q.cols?' cols':'')+'">'+q.choices.map(c=>'<li><b>'+c[0]+'</b><span>'+c[1]+'</span></li>').join('')+'</ul>':'';
  const prev=again?'<span class="prev ng">もう一度</span>':'';
  const answer='<div class="answer'+(revealed?' on':'')+'"><span class="a-label">こたえ</span>'+(revealed?answerHTML(q):'')+'</div>';
  const actions=revealed
    ? '<div class="marks"><button type="button" class="mark ok" data-act="ok"><i>○</i>あってた</button><button type="button" class="mark ng" data-act="ng"><i>×</i>まちがえた</button></div>'
    : '<button type="button" class="btn-main" data-act="reveal">答えを見る</button>';
  return ''+
    '<div class="card-top"><span class="qno"><small>問</small>'+q.n+'</span><span class="round">'+st.round+'周目</span>'+prev+
      '<span class="pos">'+clearedCount()+' / '+ALL.length+' クリア</span></div>'+
    '<p class="qtext">'+blankify(q.q)+'</p>'+items+choices+answer+
    '<div class="actions">'+actions+'</div>'+
    '<div class="nav"><button type="button" class="link" data-act="prev"'+(st.undo?'':' disabled')+'>← 1つもどる</button></div>';
}
function resultHTML(){
  const ok=firstOkCount();
  const miss=ALL.length-ok;
  const msg=miss===0?'ぜんぶ、1回目で ○ でした。':'1回目に×だった問題です。次の周の前に見直せます。';
  const label=st.round<ROUNDS?(st.round+1)+'周目へ（全'+ALL.length+'問）':'3周のまとめを見る';
  return ''+
    '<div class="card-top"><span class="eyebrow">開票結果　'+st.round+'周目</span></div>'+
    '<p class="score"><span class="s-big">'+ok+'</span><span class="s-of">/ '+ALL.length+'　1回目で○</span></p>'+
    '<p class="note">'+msg+'</p>'+missHTML()+
    '<div class="actions"><button type="button" class="btn-main" data-act="next">'+label+'</button></div>'+
    '<div class="nav"><button type="button" class="link" data-act="prev"'+(st.undo?'':' disabled')+'>← 最後の問題にもどる</button></div>';
}
function finalHTML(){
  const rows=st.hist.map(function(h,i){
    const pct=h.total?Math.round(h.ok/h.total*100):0;
    return '<li><b>'+(i+1)+'周目</b><span class="bar"><i style="width:'+pct+'%"></i></span><span class="v">'+h.ok+' / '+h.total+'</span></li>';
  }).join('');
  const miss=missHTML();
  return ''+
    '<div class="card-top"><span class="eyebrow">3周のまとめ</span></div>'+
    '<ul class="laps">'+rows+'</ul>'+
    '<p class="note">数字は、各周で1回目に ○ だった問題の数です。</p>'+
    (miss?'<p class="note">3周目で、1回目に×だった問題</p>'+miss:'<p class="note">3周目は、ぜんぶ1回目で ○ でした。</p>')+
    '<div class="actions"><button type="button" class="btn-main" data-act="restart">最初からやり直す</button></div>';
}
function renderCard(){
  $('card').innerHTML=st.finished?finalHTML():(st.queue.length?questionHTML():resultHTML());
}

/* ---------- board ---------- */
function renderBoard(){
  const now=(!st.finished&&st.queue.length)?st.queue[0]:0;
  $('cells').innerHTML=Q.map(q=>{
    const n=q.n;
    const done=!!st.cleared[n];
    let mk='',cls='';
    if(done){cls='ok';mk='○';}
    else if(st.first[n]==='ng'){cls='ng';mk='×';}
    if(n===now) cls+=' now';
    const dis=done||st.finished;
    return '<li><button type="button" class="cell '+cls+'"'+(dis?' disabled':'')+' data-act="jump" data-n="'+n+'" aria-label="問'+n+' '+(mk||'まだ')+'"><span class="n">'+n+'</span><span class="m">'+mk+'</span></button></li>';
  }).join('');
}
function renderFoot(){
  $('reset').textContent=resetArmed?'もう一度押すと、記録が全部消えます':'最初からやり直す';
}

function render(focusSel){
  renderHead();renderRail();renderCard();renderBoard();renderFoot();
  if(focusSel){
    const el=document.querySelector(focusSel);
    if(el) el.focus({preventScroll:true});
  }
}

/* ---------- actions ---------- */
function snap(){
  return {queue:st.queue.slice(),first:Object.assign({},st.first),cleared:Object.assign({},st.cleared)};
}
function mark(v){
  if(!st.queue.length||st.finished) return;
  st.undo=snap();
  const n=st.queue.shift();
  if(!st.first[n]) st.first[n]=v;
  if(v==='ok'){st.cleared[n]=true;}
  else{st.queue.push(n);}
  revealed=false;
  save();
  render('#card .btn-main');
}
function undo(){
  if(!st.undo) return;
  st.queue=st.undo.queue;st.first=st.undo.first;st.cleared=st.undo.cleared;
  st.undo=null;
  revealed=false;
  save();
  render('#card .btn-main');
}
function nextRound(){
  if(st.queue.length||st.finished) return;
  st.hist.push({ok:firstOkCount(),total:ALL.length});
  if(st.round>=ROUNDS){
    st.finished=true;
  }else{
    st.round+=1;
    st.queue=ALL.slice();
    st.first={};
    st.cleared={};
  }
  st.undo=null;
  revealed=false;
  save();
  render('#card .btn-main');
}
function restart(){
  st=fresh();
  revealed=false;
  resetArmed=false;
  clearTimeout(resetTimer);
  save();
  render('#card .btn-main');
}
function jumpTo(n){
  const i=st.queue.indexOf(n);
  if(i<0) return;
  if(i>0){st.queue.splice(i,1);st.queue.unshift(n);}
  revealed=false;
  save();
  render('#card .btn-main');
  const smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('card').scrollIntoView({block:'start',behavior:smooth?'smooth':'auto'});
}

document.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled) return;
  const act=b.dataset.act;
  if(act==='reveal'){revealed=true;render('#card .mark.ok');}
  else if(act==='ok'){mark('ok');}
  else if(act==='ng'){mark('ng');}
  else if(act==='prev'){undo();}
  else if(act==='next'){nextRound();}
  else if(act==='restart'){restart();}
  else if(act==='jump'){jumpTo(Number(b.dataset.n));}
  else if(act==='reset'){
    if(!resetArmed){
      resetArmed=true;
      renderFoot();
      resetTimer=setTimeout(function(){resetArmed=false;renderFoot();},4000);
    }else{
      restart();
    }
  }
});

render();
})();
</script>

</body>
</html>
